<!doctype html>
<!-- Miroのツールバーのアイコンを押したときにパネルを開くだけのページ -->
<html><head><meta charset="utf-8"><script src="https://miro.com/app/static/sdk/v2/miro.js"></script></head>
<body><script>
  miro.board.ui.on('icon:click', async () => {
    await miro.board.ui.openPanel({ url: 'app.html' });
  });
</script></body></html>
